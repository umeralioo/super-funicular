name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          if ls *.zip 1>/dev/null 2>&1; then
            unzip -q *.zip
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK
        run: |
          CMDLINE=/usr/local/lib/android/sdk/cmdline-tools/latest/bin
          if [ ! -f "$CMDLINE/sdkmanager" ]; then
            CMDLINE=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin
          fi
          yes | $CMDLINE/sdkmanager --licenses > /dev/null 2>&1 || true
          $CMDLINE/sdkmanager "ndk;27.2.12479018"
          echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "LIB_OUT=$HOME/ndk-libs" >> $GITHUB_ENV

      - name: Diagnose ELF function declarations
        run: |
          test -f jni/Android.mk  && echo "Android.mk OK"
          test -f jni/Application.mk && echo "Application.mk OK"
          grep "LOCAL_MODULE" jni/Android.mk || true
          test -f jni/shadowhook_nothing.cpp && echo "nothing.cpp OK" || echo "nothing.cpp MISSING"

      - name: Build libffk_pro.so
        run: |
          set -euxo pipefail
          $NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=$(pwd) \
            APP_BUILD_SCRIPT=$(pwd)/jni/Android.mk \
            NDK_APPLICATION_MK=$(pwd)/jni/Application.mk \
            NDK_OUT=$HOME/ndk-obj \
            NDK_LIBS_OUT=$LIB_OUT
          ls -lh $LIB_OUT/arm64-v8a/
          test -f $LIB_OUT/arm64-v8a/libunity_analytics_ext.so
          test -f $LIB_OUT/arm64-v8a/libshadowhook_nothing.so
          echo "Build SUCCESS: $(ls -sh $LIB_OUT/arm64-v8a/libunity_analytics_ext.so)"
          echo "Nothing lib:   $(ls -sh $LIB_OUT/arm64-v8a/libshadowhook_nothing.so)"
          # Copy to workspace root for reliable artifact upload
          cp $LIB_OUT/arm64-v8a/libunity_analytics_ext.so ./libunity_analytics_ext.so
          cp $LIB_OUT/arm64-v8a/libshadowhook_nothing.so ./libshadowhook_nothing.so

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-arm64
          path: |
            ./libunity_analytics_ext.so
            ./libshadowhook_nothing.so
          if-no-files-found: error
          
