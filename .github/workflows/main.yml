name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          if ls *.zip 1>/dev/null 2>&1; then
            unzip -q *.zip
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager "ndk;27.2.12479018"

      - name: Diagnose ELF function declarations
        run: |
          test -f jni/Android.mk  && echo "Android.mk OK" || echo "MISSING Android.mk"
          test -f jni/Application.mk && echo "Application.mk OK" || echo "MISSING Application.mk"
          grep "LOCAL_MODULE" jni/Android.mk || true

      - name: Build libffk_pro.so
        run: |
          set -euxo pipefail
          NDK=/usr/local/lib/android/sdk/ndk/27.2.12479018
          test -f jni/Android.mk
          test -f jni/Application.mk
          $NDK/ndk-build \
            NDK_PROJECT_PATH=$(pwd) \
            APP_BUILD_SCRIPT=$(pwd)/jni/Android.mk \
            NDK_APPLICATION_MK=$(pwd)/jni/Application.mk \
            NDK_OUT=$HOME/_temp/ndk-obj \
            NDK_LIBS_OUT=$HOME/_temp/ndk-libs
          # Module is now libunity_analytics_ext — check for that name
          # (was previously libffk_pro before rename for evasion)
          LIB_OUT=$HOME/_temp/ndk-libs/arm64-v8a
          ls -lh $LIB_OUT/
          test -f $LIB_OUT/libunity_analytics_ext.so
          echo "Build SUCCESS: libunity_analytics_ext.so ready"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-arm64
          path: ~/._temp/ndk-libs/arm64-v8a/libunity_analytics_ext.so
          if-no-files-found: error

      - name: Post Checkout repository
        if: always()
        run: echo "done"
        
