name: Build FFKPro Tracer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: NDK Build arm64-v8a
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: ~/.android/ndk
          key: ndk-r25c-${{ runner.os }}

      - name: Print build env
        run: |
          echo "NDK: ${{ steps.setup-ndk.outputs.ndk-path }}"
          ${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build --version || true
          find . -name "*.c" -o -name "*.cpp" -o -name "*.mk" | head -40

      - name: Build libffk_pro.so
        run: |
          ${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j$(nproc) \
            V=1
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Verify output
        run: |
          find libs/ -name "*.so" -exec ls -lh {} \;
          file libs/arm64-v8a/libffk_pro.so

      - name: Strip .so
        run: |
          ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip \
            --strip-unneeded libs/arm64-v8a/libffk_pro.so
          ls -lh libs/arm64-v8a/libffk_pro.so

      - name: Upload libffk_pro.so
        uses: actions/upload-artifact@v4
        with:
          name: libffk_pro-arm64-${{ github.sha }}
          path: libs/arm64-v8a/libffk_pro.so
          retention-days: 30

      - name: Upload all libs
        uses: actions/upload-artifact@v4
        with:
          name: ffkpro-libs-${{ github.sha }}
          path: libs/
          retention-days: 30

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: libffk_pro-arm64-${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: libffk_pro.so
          name: FFKPro ${{ github.ref_name }}
          body: |
            ## FFKPro Tracer ${{ github.ref_name }}
            Built from ${{ github.sha }}
            ### Files
            - libffk_pro.so — arm64-v8a stripped
            ### Install
            Drop into FF APK lib/arm64-v8a/ via MT Manager
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
