name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          if ls *.zip 1>/dev/null 2>&1; then
            unzip -q *.zip
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK
        run: |
          # Use pre-installed cmdline-tools to install NDK directly — skip setup-android action
          # which fails trying to install the deprecated 'tools' package
          CMDLINE=/usr/local/lib/android/sdk/cmdline-tools/latest/bin
          if [ ! -f $CMDLINE/sdkmanager ]; then
            CMDLINE=/usr/local/lib/android/sdk/cmdline-tools/16.0/bin
          fi
          echo "Using sdkmanager at $CMDLINE"
          # Accept licenses silently
          yes | $CMDLINE/sdkmanager --licenses > /dev/null 2>&1 || true
          # Install NDK only — no 'tools' package (it's deprecated and removed)
          $CMDLINE/sdkmanager "ndk;27.2.12479018"
          echo "NDK_HOME=/usr/local/lib/android/sdk/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Diagnose ELF function declarations
        run: |
          test -f jni/Android.mk  && echo "Android.mk OK"
          test -f jni/Application.mk && echo "Application.mk OK"
          echo "NDK: $NDK_HOME"
          grep "LOCAL_MODULE" jni/Android.mk || true

      - name: Build libffk_pro.so
        run: |
          set -euxo pipefail
          NDK=$NDK_HOME
          test -f jni/Android.mk
          test -f jni/Application.mk
          $NDK/ndk-build \
            NDK_PROJECT_PATH=$(pwd) \
            APP_BUILD_SCRIPT=$(pwd)/jni/Android.mk \
            NDK_APPLICATION_MK=$(pwd)/jni/Application.mk \
            NDK_OUT=$HOME/_temp/ndk-obj \
            NDK_LIBS_OUT=$HOME/_temp/ndk-libs
          LIB=$HOME/_temp/ndk-libs/arm64-v8a
          ls -lh $LIB/
          test -f $LIB/libunity_analytics_ext.so
          echo "Build SUCCESS"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-arm64
          path: ~/._temp/ndk-libs/arm64-v8a/libunity_analytics_ext.so
          if-no-files-found: error
          
