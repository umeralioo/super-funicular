name: Build Android Native Library

on:
  workflow_dispatch:
  push:
    paths:
      - 'jni/**'
      - 'umar_v165_actions.zip'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'jni/**'
      - 'umar_v165_actions.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euxo pipefail

          test -f umar_v165_actions.zip
          unzip -o umar_v165_actions.zip -d "$GITHUB_WORKSPACE"

          test -f jni/Android.mk
          test -f jni/Application.mk

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager --install "ndk;27.2.12479018"

      - name: Diagnose ELF function declarations
        shell: bash
        run: |
          echo "Searching for function declarations and definitions..."

          grep -RInE \
            'bh_task_hook_elf|bh_elf_manager_iterate|bh_elf_manager_refresh' \
            jni \
            --include='*.h' \
            --include='*.hpp' \
            --include='*.c' \
            --include='*.cpp' || true

          echo "Checking first failing source section..."
          sed -n '1215,1250p' jni/ffk_pro.c

          echo "Checking second failing source section..."
          sed -n '1420,1450p' jni/ffk_pro.c

      - name: Build libffk_pro.so
        shell: bash
        run: |
          set -euxo pipefail

          NDK="$ANDROID_HOME/ndk/27.2.12479018"

          test -f jni/Android.mk
          test -f jni/Application.mk

          "$NDK/ndk-build" \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE" \
            APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/jni/Android.mk" \
            NDK_APPLICATION_MK="$GITHUB_WORKSPACE/jni/Application.mk" \
            NDK_OUT="$RUNNER_TEMP/ndk-obj" \
            NDK_LIBS_OUT="$RUNNER_TEMP/ndk-libs"

          test -f "$RUNNER_TEMP/ndk-libs/arm64-v8a/libffk_pro.so"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: libffk_pro
          path: ${{ runner.temp }}/ndk-libs/arm64-v8a/libffk_pro.so
          if-no-files-found: error
          
