name: Acernis-v155 Tracer NDK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup jdk 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup android ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Cache NDK
      uses: actions/cache@v4
      with:
        path: /opt/hostedtoolcache/ndk
        key: ndk-r25c

    - name: Print build env
      run: env | grep -E 'ANDROID|NDK|JAVA'

    - name: Build libffk.pro.so
      run: |
        export ANDROID_PLATFORM=android-19
        cd android
        mkdir -p src/jni
        cat > src/jni/Android.mk << EOF
          LOCAL_PATH := \$(call my-dir)
          include \$(CLEAR_VARS)
          LOCAL_MODULE := ffk
          LOCAL_SRC_FILES := ffk.c
          include \$(BUILD_SHARED_LIBRARY)
        EOF
        ./gradlew :app:build --no-daemon

    - name: Upload libffk.pro.so
      uses: actions/upload-artifact@v4
      with:
        name: libffk.pro.so
        path: android/app/build/intermediates/ndkBuild/release/obj/local/arm64-v8a/libffk.pro.so
