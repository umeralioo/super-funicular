name: Build Android native library

on:
  workflow_dispatch:
  push:
    paths:
      - 'jni/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'jni/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Build libffk_pro.so
        shell: bash
        run: |
          set -euxo pipefail
          test -f jni/Android.mk
          test -f jni/Application.mk
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          "$NDK/ndk-build" \
            NDK_PROJECT_PATH="$GITHUB_WORKSPACE" \
            APP_BUILD_SCRIPT="$GITHUB_WORKSPACE/jni/Android.mk" \
            NDK_APPLICATION_MK="$GITHUB_WORKSPACE/jni/Application.mk" \
            NDK_OUT="$RUNNER_TEMP/ndk-obj" \
            NDK_LIBS_OUT="$RUNNER_TEMP/ndk-libs"
          test -f "$RUNNER_TEMP/ndk-libs/arm64-v8a/libffk_pro.so"

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: libffk_pro
          path: ${{ runner.temp }}/ndk-libs/arm64-v8a/libffk_pro.so
          if-no-files-found: error
          
